server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: portfoliopro-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:portfoliopro}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=5000&socketTimeout=30000
    username: ${DB_USER:portfolio_user}
    password: ${DB_PASSWORD:portfolio_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:PortfolioProSuperSecureAccessJwtKey2026ForNseTradingPlatform99!}
    refresh-secret: ${JWT_REFRESH_SECRET:PortfolioProSuperSecureRefreshJwtKey2026ForNseTradingPlatform99!}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  wallet:
    initial-balance: 1000000.00

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
